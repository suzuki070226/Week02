<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSSE Cafe メニュー</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>


<body class="bg-gray-50 mx-auto max-w-2xl">


<header class="bg-gray-100 px-4 py-2 m-2 border mx-auto">

    <h1 class="p-1 text-3xl">POSSE CAFE</h1>
     <p class="text-gray-400 text-sm">POSSE CAFE 通年分メニュー</p>

</header>    


<main class="mx-auto">


    <section class="shadow-md rounded-lg p-2 m-2  bg-white">

        <h2 class="font-bold text-lg p-1 text-gray-600">コーヒー</h2>
          <ul class="text-gray-800">
            <li class="p-1 text-base flex">グアテマラ <div class="text-sm py-1">600yen</div></li>
            <li class="p-1 text-base flex">キリマンジャロ <div class="text-sm py-1">600yen</div></li>
            <li class="p-1 text-base flex">フラットホワイト <div class="text-sm py-1">600yen</div></li>
            <li class="p-1 text-base flex">カフェラテ <div class="text-sm py-1">600yen</div></li>
            </ul>
    </section>

     <section class="shadow-md rounded-lg p-2 m-2  bg-white">

        <h2 class="font-bold text-lg p-1 text-gray-600">ティー</h2>
           <ul class="p-1 text-gray-800">
             <li class="p-1 text-base flex">ダージリン <div class="text-sm py-1">600yen</div></li>
             <li class="p-1 text-base flex">アールグレイ <div class="text-sm py-1">600yen</div></li>
            </ul>
        
    </section>

     <section class="shadow-md rounded-lg p-2 m-2  bg-white">

        <h2 class="font-bold text-lg p-1 text-gray-600">フード</h2>
           <ul class="p-1 text-base text-gray-800">
             <li class="p-1 text-base flex">サンドイッチ <div class="text-sm py-1">500yen</div></li>
             <li class="p-1 text-base flex">クッキー <div class="text-sm py-1">400yen</div></li>
            </ul>
        
    </section>


</main>


<footer class="bg-gray-100 text-center py-6 text-gray-500 text-sm">

<button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
  注文をはじめる
</button>

    <p>2026 POSSE CAFE</p>

</footer>


</body>


</html>
